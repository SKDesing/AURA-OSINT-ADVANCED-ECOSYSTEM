version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aura-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_PORT=3000
    volumes:
      - ./backend/storage/data:/app/backend/storage/data
      - /tmp/osint-sherlock:/tmp/osint-sherlock
      - /tmp/osint-subfinder:/tmp/osint-subfinder
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aura-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aura-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - aura-network

  nginx:
    image: nginx:alpine
    container_name: aura-nginx
    ports:
      - "8888:80"
      - "8443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - aura-network

networks:
  aura-network:
    driver: bridge

volumes:
  backend-data:
